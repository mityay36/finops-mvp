apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-api
  namespace: finops
  labels:
    app: finops-api
    team: platform
    env: production
spec:
  # APScheduler runs in-process; replicas: 1 to avoid duplicate jobs.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: finops-api
  template:
    metadata:
      labels:
        app: finops-api
        team: platform
        env: production
    spec:
      initContainers:
        - name: migrate
          image: cr.yandex/crppm2p2j5q3tmf17su4/finops-api:fd9c918
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: finops-api-config
            - secretRef:
                name: finops-api-secrets
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      containers:
        - name: api
          image: cr.yandex/crppm2p2j5q3tmf17su4/finops-api:fd9c918
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: finops-api-config
            - secretRef:
                name: finops-api-secrets
          env:
            - name: FINOPS_RULE_WINDOW_DAYS
              value: "3"
            - name: FINOPS_RULE_MIN_VALID_DAYS
              value: "2"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
