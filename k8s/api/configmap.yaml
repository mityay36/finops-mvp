apiVersion: v1
kind: ConfigMap
metadata:
  name: finops-api-config
  namespace: finops
data:
  ENV: "production"
  CORS_ORIGINS: '["*"]'
  DATABASE_ECHO: "false"
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "20"
  CACHE_DEFAULT_TTL: "300"
  SCHEDULER_ENABLED: "true"
  BILLING_SYNC_INTERVAL_MINUTES: "60"
  ALLOCATIONS_SNAPSHOT_INTERVAL_MINUTES: "60"
